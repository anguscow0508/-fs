<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>釣魚分享平台｜熱血 Fishing Soul</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #7c2d12);
      color: #fff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid #f97316;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
      color: #fb923c;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(249,115,22,0.6);
    }

    .nav-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links button {
      border: none;
      background: #ea580c;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: .25s;
    }

    .nav-links button:hover {
      background: #c2410c;
      transform: translateY(-2px);
    }

    .container {
      width: min(1100px, 94%);
      margin: 24px auto 40px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(249,115,22,.25), rgba(30,41,59,.8));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .hero h1 {
      font-size: 36px;
      color: #fdba74;
      margin-bottom: 10px;
    }

    .hero p {
      color: #e2e8f0;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
      backdrop-filter: blur(6px);
    }

    .card h2, .card h3 {
      margin-bottom: 16px;
      color: #fb923c;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: #f97316;
      border-color: #f97316;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #fed7aa;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #64748b;
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #cbd5e1;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .25s;
      margin-right: 8px;
      margin-top: 4px;
    }

    .btn-primary {
      background: linear-gradient(90deg, #f97316, #ef4444);
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #475569;
      color: white;
    }

    .btn-secondary:hover {
      background: #334155;
    }

    .hidden {
      display: none !important;
    }

    .profile-box {
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fb923c;
      box-shadow: 0 0 15px rgba(249,115,22,.35);
      background: #1e293b;
    }

    .profile-box h3 {
      margin-top: 12px;
      margin-bottom: 6px;
    }

    .profile-box p {
      color: #cbd5e1;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .post-card {
      background: rgba(15,23,42,0.72);
      border: 1px solid rgba(251,146,60,0.22);
      border-left: 5px solid #f97316;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,.22);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .post-header .avatar {
      width: 54px;
      height: 54px;
    }

    .post-user h4 {
      color: #fff;
      margin-bottom: 4px;
    }

    .post-user span {
      color: #cbd5e1;
      font-size: 14px;
    }

    .post-title {
      font-size: 22px;
      color: #fdba74;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .post-content {
      color: #f8fafc;
      line-height: 1.7;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .post-image {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .post-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .action-btn:hover {
      background: rgba(249,115,22,0.18);
      border-color: #fb923c;
    }

    .comment-box {
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .comment-item {
      background: rgba(255,255,255,0.05);
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .comment-item strong {
      color: #fdba74;
    }

    .comment-form {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .comment-form input {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #64748b;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .empty {
      color: #cbd5e1;
      text-align: center;
      padding: 24px;
      border: 1px dashed rgba(255,255,255,.18);
      border-radius: 14px;
    }

    .footer-note {
      text-align: center;
      color: #cbd5e1;
      margin-top: 28px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 28px;
      }
    }

    /* 九宮格雙重驗證樣式 */
    .captcha-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .captcha-content {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(251, 146, 60, 0.3);
      border-radius: 20px;
      padding: 24px;
      width: min(380px, 90%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .captcha-content h2 {
      color: #fb923c;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .captcha-content p {
      color: #cbd5e1;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .captcha-target-text {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      background: rgba(249, 115, 22, 0.25);
      padding: 6px 14px;
      border-radius: 10px;
      margin: 0 6px;
      border: 1px solid rgba(249, 115, 22, 0.4);
    }

    .captcha-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .captcha-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 2px solid transparent;
      border-radius: 14px;
      font-size: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.25s;
      user-select: none;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }

    .captcha-item:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #475569, #334155);
      border-color: rgba(249, 115, 22, 0.5);
    }

    .captcha-item.selected {
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.15);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.35);
      transform: scale(0.95);
    }

    .captcha-item.selected::after {
      content: '✔';
      position: absolute;
      bottom: -8px;
      right: -8px;
      background: #f97316;
      color: white;
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #1e293b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .captcha-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="brand">🎣 熱血釣魂 Fishing Share</div>
    <div class="nav-links">
      <button onclick="showSection('homeSection')">分享區</button>
      <button onclick="showSection('profileSection')">個人首頁</button>
      <button onclick="showSection('createPostSection')">新增貼文</button>
      <button onclick="handleLogout()">登出</button>
    </div>
  </div>

  <div class="container">
    <div class="hero">
      <h1>釣上熱血，分享戰績！</h1>
      <p>
        歡迎來到釣魚分享平台！這裡可以註冊帳號、分享你的釣魚故事、上傳漁獲照片、
        與其他釣友交流留言。無論你是海釣高手、溪釣玩家，還是剛入門的新手，
        都可以在這裡留下屬於自己的熱血紀錄！
      </p>
    </div>

    <div class="grid">
      <!-- 左側登入 / 個人資訊 -->
      <div class="card">
        <div id="authSection">
          <h2>會員專區</h2>
          <div class="tabs">
            <button class="tab-btn active" onclick="switchAuthTab('login')">登入</button>
            <button class="tab-btn" onclick="switchAuthTab('register')">註冊</button>
          </div>

          <!-- 登入 -->
          <div id="loginTab">
            <div class="form-group">
              <label>帳號 ID</label>
              <input type="text" id="loginId" placeholder="請輸入帳號 ID" />
            </div>
            <div class="form-group">
              <label>密碼</label>
              <input type="password" id="loginPassword" placeholder="請輸入密碼" />
            </div>
            <button class="btn btn-primary" onclick="login()">登入</button>
          </div>

          <!-- 註冊 -->
          <div id="registerTab" class="hidden">
            <div class="form-group">
              <label>帳號 ID</label>
              <input type="text" id="registerId" placeholder="請設定帳號 ID" />
            </div>
            <div class="form-group">
              <label>名稱</label>
              <input type="text" id="registerName" placeholder="請輸入顯示名稱" />
            </div>
            <div class="form-group">
              <label>密碼</label>
              <input type="password" id="registerPassword" placeholder="請設定密碼" />
            </div>
            <div class="form-group">
              <label>上傳頭貼</label>
              <input type="file" id="registerAvatar" accept="image/*" />
            </div>
            <button class="btn btn-primary" onclick="register()">註冊帳號</button>
          </div>
        </div>

        <div id="userPanel" class="hidden">
          <h2>我的資訊</h2>
          <div class="profile-box">
            <img id="userAvatar" class="avatar" src="" alt="頭貼" />
            <h3 id="userName">使用者名稱</h3>
            <p>ID：<span id="userIdText"></span></p>
            <div style="margin-top: 14px;">
              <button class="btn btn-primary" onclick="showSection('profileSection')">個人首頁</button>
              <button class="btn btn-secondary" onclick="showSection('createPostSection')">新增貼文</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側主畫面 -->
      <div>
        <!-- 分享區 -->
        <div id="homeSection" class="card">
          <div class="section-title">
            <h2>🔥 大家都在看的分享區</h2>
          </div>
          <div id="allPosts" class="post-list"></div>
        </div>

        <!-- 個人首頁 -->
        <div id="profileSection" class="card hidden">
          <div class="section-title">
            <h2>🏆 個人首頁</h2>
            <button class="btn btn-primary" onclick="showSection('createPostSection')">＋ 新增貼文</button>
          </div>
          <div id="myPosts" class="post-list"></div>
        </div>

        <!-- 他人首頁 -->
        <div id="otherProfileSection" class="card hidden">
          <div class="section-title">
            <h2><span id="otherProfileTitle"></span> 的個人頁面</h2>
            <button class="btn btn-secondary" onclick="showSection('homeSection')">返回分享區</button>
          </div>
          <div id="otherProfilePosts" class="post-list"></div>
        </div>

        <!-- 發文頁 -->
        <div id="createPostSection" class="card hidden">
          <div class="section-title">
            <h2>🎣 發布你的熱血貼文</h2>
          </div>

          <div id="createPostUserInfo" class="post-header hidden">
            <img id="createPostAvatar" class="avatar" src="" alt="頭貼" />
            <div class="post-user">
              <h4 id="createPostName"></h4>
              <span id="createPostId"></span>
            </div>
          </div>

          <div id="createPostForm">
            <div class="form-group">
              <label>發布主題</label>
              <input type="text" id="postTitle" placeholder="例如：今天在日月潭釣到超大尾！" />
            </div>
            <div class="form-group">
              <label>發布內容</label>
              <textarea id="postContent" placeholder="分享你的釣點、釣法、魚種、心情與戰績吧！"></textarea>
            </div>
            <div class="form-group">
              <label>上傳照片（可選）</label>
              <input type="file" id="postImage" accept="image/*" />
            </div>
            <button class="btn btn-primary" onclick="createPost()">發布貼文</button>
            <button class="btn btn-secondary" onclick="showSection('profileSection')">返回個人首頁</button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-note">
      前端展示版：資料儲存在瀏覽器 localStorage，適合專題 Demo / 作業展示。
    </div>
  </div>

  <!-- 九宮格驗證 Modal -->
  <div id="captchaModal" class="captcha-modal hidden">
    <div class="captcha-content">
      <h2>🛡️ 雙重安全驗證</h2>
      <p>請選取以下包含 <span id="captchaTargetName" class="captcha-target-text"></span> 的所有圖片</p>
      <div id="captchaGrid" class="captcha-grid">
        <!-- JS 動態生成 9 個格子 -->
      </div>
      <div class="captcha-actions">
        <button class="btn btn-primary" onclick="verifyCaptcha()" style="width: 100px;">驗證</button>
        <button class="btn btn-secondary" onclick="closeCaptcha()" style="width: 100px;">取消</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 資料初始化 =====
    let users = JSON.parse(localStorage.getItem("fishing_users")) || [];
    let posts = JSON.parse(localStorage.getItem("fishing_posts")) || [];
    let currentUser = JSON.parse(localStorage.getItem("fishing_currentUser")) || null;

    const defaultAvatar =
      "https://cdn-icons-png.flaticon.com/512/149/149071.png";

    function saveUsers() {
      localStorage.setItem("fishing_users", JSON.stringify(users));
    }

    function savePosts() {
      localStorage.setItem("fishing_posts", JSON.stringify(posts));
    }

    function saveCurrentUser() {
      localStorage.setItem("fishing_currentUser", JSON.stringify(currentUser));
    }

    function switchAuthTab(tab) {
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");
      const tabButtons = document.querySelectorAll(".tab-btn");

      tabButtons.forEach(btn => btn.classList.remove("active"));

      if (tab === "login") {
        loginTab.classList.remove("hidden");
        registerTab.classList.add("hidden");
        tabButtons[0].classList.add("active");
      } else {
        registerTab.classList.remove("hidden");
        loginTab.classList.add("hidden");
        tabButtons[1].classList.add("active");
      }
    }

    function showSection(sectionId) {
      document.getElementById("homeSection").classList.add("hidden");
      document.getElementById("profileSection").classList.add("hidden");
      document.getElementById("createPostSection").classList.add("hidden");
      document.getElementById("otherProfileSection").classList.add("hidden");

      if (sectionId === "profileSection" || sectionId === "createPostSection") {
        if (!currentUser) {
          alert("請先登入後再使用此功能！");
          document.getElementById("homeSection").classList.remove("hidden");
          return;
        }
      }

      document.getElementById(sectionId).classList.remove("hidden");

      if (sectionId === "profileSection") renderMyPosts();
      if (sectionId === "createPostSection") renderCreatePostUser();
      if (sectionId === "homeSection") renderAllPosts();
    }

    function showUserProfile(userId) {
      if (currentUser && currentUser.id === userId) {
        showSection("profileSection");
        return;
      }
      
      const user = users.find(u => u.id === userId);
      if (!user) {
        alert("找不到此使用者！");
        return;
      }
      
      document.getElementById("otherProfileTitle").textContent = user.name;
      showSection("otherProfileSection");
      
      const container = document.getElementById("otherProfilePosts");
      const userPosts = posts.filter(post => post.userId === userId);
      
      if (userPosts.length === 0) {
        container.innerHTML = `<div class="empty">這位釣友目前還沒有貼文喔！</div>`;
      } else {
        container.innerHTML = userPosts.map(post => renderPostCard(post, false)).join("");
      }
    }

    function fileToBase64(file, callback) {
      if (!file) {
        callback(null);
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        callback(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    // ===== 九宮格驗證邏輯 =====
    let captchaTarget = null;
    let pendingAction = null;
    let selectedCaptchaIndices = new Set();
    const fishList = ["🐟", "🐡", "🦈", "🦐", "🦀", "🦑", "🐙", "🐬"];
    const fishNames = {
      "🐟": "鮭魚",
      "🐡": "河豚",
      "🦈": "鯊魚",
      "🦐": "蝦子",
      "🦀": "螃蟹",
      "🦑": "烏賊",
      "🐙": "章魚",
      "🐬": "海豚"
    };

    function initCaptcha(action) {
      pendingAction = action;
      selectedCaptchaIndices.clear();
      
      captchaTarget = fishList[Math.floor(Math.random() * fishList.length)];
      
      const grid = document.getElementById("captchaGrid");
      grid.innerHTML = "";
      
      let targetCount = Math.floor(Math.random() * 3) + 2; // 產生 2~4 個目標生物
      let items = [];
      
      for(let i=0; i<targetCount; i++) {
        items.push(captchaTarget);
      }
      
      while(items.length < 9) {
        let randomFish = fishList[Math.floor(Math.random() * fishList.length)];
        if (randomFish !== captchaTarget) {
          items.push(randomFish);
        }
      }
      
      items.sort(() => Math.random() - 0.5);
      
      items.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "captcha-item";
        div.textContent = item;
        div.onclick = () => toggleCaptchaItem(index, div);
        div.dataset.fish = item;
        grid.appendChild(div);
      });
      
      document.getElementById("captchaTargetName").textContent = `${fishNames[captchaTarget]} ${captchaTarget}`;
      document.getElementById("captchaModal").classList.remove("hidden");
    }

    function toggleCaptchaItem(index, el) {
      if (selectedCaptchaIndices.has(index)) {
        selectedCaptchaIndices.delete(index);
        el.classList.remove("selected");
      } else {
        selectedCaptchaIndices.add(index);
        el.classList.add("selected");
      }
    }

    function verifyCaptcha() {
      const items = document.querySelectorAll(".captcha-item");
      let isCorrect = true;
      let hasTarget = false;
      
      items.forEach((el, index) => {
        const isTarget = el.dataset.fish === captchaTarget;
        const isSelected = selectedCaptchaIndices.has(index);
        
        if (isTarget) hasTarget = true;
        
        if (isTarget && !isSelected) {
          isCorrect = false;
        }
        if (!isTarget && isSelected) {
          isCorrect = false;
        }
      });
      
      if (!isCorrect) {
        alert("驗證失敗！請確實選取所有目標生物。");
        initCaptcha(pendingAction); // 重生九宮格
        return;
      }
      
      const action = pendingAction;
      closeCaptcha();
      if (action === "login") {
        doLogin();
      } else if (action === "register") {
        doRegister();
      }
    }

    function closeCaptcha() {
      document.getElementById("captchaModal").classList.add("hidden");
      pendingAction = null;
    }

    function register() {
      const id = document.getElementById("registerId").value.trim();
      const name = document.getElementById("registerName").value.trim();
      const password = document.getElementById("registerPassword").value.trim();

      if (!id || !name || !password) {
        alert("請完整填寫 ID、名稱、密碼！");
        return;
      }

      const existed = users.find(user => user.id === id);
      if (existed) {
        alert("此 ID 已被註冊，請更換其他 ID！");
        return;
      }

      initCaptcha('register');
    }

    function doRegister() {
      const id = document.getElementById("registerId").value.trim();
      const name = document.getElementById("registerName").value.trim();
      const password = document.getElementById("registerPassword").value.trim();
      const avatarFile = document.getElementById("registerAvatar").files[0];

      fileToBase64(avatarFile, function(avatarBase64) {
        const newUser = {
          id,
          name,
          password,
          avatar: avatarBase64 || defaultAvatar
        };

        users.push(newUser);
        saveUsers();

        alert("註冊成功！請重新登入。");
        document.getElementById("registerId").value = "";
        document.getElementById("registerName").value = "";
        document.getElementById("registerPassword").value = "";
        document.getElementById("registerAvatar").value = "";

        switchAuthTab("login");
      });
    }

    function login() {
      const id = document.getElementById("loginId").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!id || !password) {
        alert("請輸入帳號與密碼！");
        return;
      }

      const user = users.find(u => u.id === id && u.password === password);
      if (!user) {
        alert("登入失敗，請確認帳號或密碼是否正確。");
        return;
      }

      initCaptcha('login');
    }

    function doLogin() {
      const id = document.getElementById("loginId").value.trim();
      const user = users.find(u => u.id === id);

      currentUser = user;
      saveCurrentUser();
      updateUserUI();
      showSection("profileSection");

      alert(`登入成功，歡迎你 ${user.name}！`);
    }

    function handleLogout() {
      if (!currentUser) {
        alert("目前尚未登入。");
        return;
      }

      currentUser = null;
      saveCurrentUser();
      updateUserUI();
      showSection("homeSection");
      alert("已成功登出。");
    }

    function updateUserUI() {
      const authSection = document.getElementById("authSection");
      const userPanel = document.getElementById("userPanel");
      const createPostUserInfo = document.getElementById("createPostUserInfo");

      if (currentUser) {
        authSection.classList.add("hidden");
        userPanel.classList.remove("hidden");

        document.getElementById("userAvatar").src = currentUser.avatar || defaultAvatar;
        document.getElementById("userName").textContent = currentUser.name;
        document.getElementById("userIdText").textContent = currentUser.id;

        document.getElementById("createPostAvatar").src = currentUser.avatar || defaultAvatar;
        document.getElementById("createPostName").textContent = currentUser.name;
        document.getElementById("createPostId").textContent = `ID：${currentUser.id}`;
        createPostUserInfo.classList.remove("hidden");
      } else {
        authSection.classList.remove("hidden");
        userPanel.classList.add("hidden");
        createPostUserInfo.classList.add("hidden");
      }

      renderAllPosts();
      renderMyPosts();
    }

    function renderCreatePostUser() {
      if (!currentUser) return;
      document.getElementById("createPostAvatar").src = currentUser.avatar || defaultAvatar;
      document.getElementById("createPostName").textContent = currentUser.name;
      document.getElementById("createPostId").textContent = `ID：${currentUser.id}`;
    }

    function createPost() {
      if (!currentUser) {
        alert("請先登入後再發文！");
        return;
      }

      const title = document.getElementById("postTitle").value.trim();
      const content = document.getElementById("postContent").value.trim();
      const imageFile = document.getElementById("postImage").files[0];

      if (!title || !content) {
        alert("請填寫發布主題與發布內容！");
        return;
      }

      fileToBase64(imageFile, function(imageBase64) {
        const post = {
          id: Date.now(),
          userId: currentUser.id,
          userName: currentUser.name,
          userAvatar: currentUser.avatar || defaultAvatar,
          title,
          content,
          image: imageBase64 || null,
          likes: 0,
          likedUsers: [],
          comments: [],
          createdAt: new Date().toLocaleString("zh-TW")
        };

        posts.unshift(post);
        savePosts();

        document.getElementById("postTitle").value = "";
        document.getElementById("postContent").value = "";
        document.getElementById("postImage").value = "";

        renderAllPosts();
        renderMyPosts();
        showSection("profileSection");

        alert("貼文發布成功！已同步到分享區與你的個人首頁。");
      });
    }

    function deletePost(postId) {
      if (!currentUser) return;
      if (!confirm("確定要刪除這篇熱血戰績嗎？此動作無法復原！")) return;
      
      const index = posts.findIndex(p => p.id === postId && p.userId === currentUser.id);
      if (index !== -1) {
        posts.splice(index, 1);
        savePosts();
        renderAllPosts();
        renderMyPosts();
        alert("已成功刪除貼文！");
      } else {
        alert("找不到貼文或無權限刪除。");
      }
    }

    function toggleLike(postId) {
      if (!currentUser) {
        alert("請先登入後再按讚！");
        return;
      }

      const post = posts.find(p => p.id === postId);
      if (!post) return;

      const likedIndex = post.likedUsers.indexOf(currentUser.id);

      if (likedIndex === -1) {
        post.likedUsers.push(currentUser.id);
        post.likes += 1;
      } else {
        post.likedUsers.splice(likedIndex, 1);
        post.likes -= 1;
      }

      savePosts();
      renderAllPosts();
      renderMyPosts();
    }

    function submitComment(postId) {
      const input = document.getElementById(`commentInput-${postId}`);
      if (!input) return;

      if (!currentUser) {
        const goLogin = confirm("是否有平台帳號？若尚未登入，將導向登入／註冊頁面。");
        if (goLogin) {
          showSection("homeSection");
          document.getElementById("loginId").scrollIntoView({ behavior: "smooth" });
        }
        return;
      }

      const text = input.value.trim();
      if (!text) {
        alert("請輸入留言內容！");
        return;
      }

      const post = posts.find(p => p.id === postId);
      if (!post) return;

      post.comments.push({
        userId: currentUser.id,
        userName: currentUser.name,
        text,
        createdAt: new Date().toLocaleString("zh-TW")
      });

      savePosts();
      renderAllPosts();
      renderMyPosts();
    }

    function renderPostCard(post, isMyPost = false) {
      const commentsHtml = post.comments.length
        ? post.comments.map(comment => `
            <div class="comment-item">
              <strong style="cursor:pointer;" onclick="showUserProfile('${comment.userId}')">${comment.userName}</strong>（${comment.userId}）：
              ${comment.text}
              <div style="font-size:12px;color:#cbd5e1;margin-top:4px;">${comment.createdAt}</div>
            </div>
          `).join("")
        : `<div class="empty" style="padding:12px;">目前還沒有留言，快來搶頭香！</div>`;

      const liked = currentUser && post.likedUsers.includes(currentUser.id);

      return `
        <div class="post-card">
          <div class="post-header">
            <img class="avatar" src="${post.userAvatar || defaultAvatar}" alt="頭貼" style="cursor:pointer;" onclick="showUserProfile('${post.userId}')" />
            <div class="post-user">
              <h4 style="cursor:pointer;" onclick="showUserProfile('${post.userId}')">${post.userName}</h4>
              <span>ID：${post.userId} ｜ ${post.createdAt}</span>
            </div>
          </div>

          <div class="post-title">${post.title}</div>
          <div class="post-content">${post.content}</div>

          ${post.image ? `<img class="post-image" src="${post.image}" alt="貼文圖片" />` : ""}

          <div class="post-actions">
            <button class="action-btn" onclick="toggleLike(${post.id})">
              ${liked ? "💖 已按讚" : "🤍 按讚"} (${post.likes})
            </button>
            <button class="action-btn" onclick="focusComment(${post.id})">
              💬 留言 (${post.comments.length})
            </button>
            ${currentUser && currentUser.id === post.userId ? `<button class="action-btn" style="color:#ef4444; border-color:rgba(239, 68, 68, 0.3);" onclick="deletePost(${post.id})">🗑️ 刪除</button>` : ""}
          </div>

          <div class="comment-box">
            <h4 style="margin-bottom:10px;color:#fdba74;">留言區</h4>
            ${commentsHtml}

            <div class="comment-form">
              <input
                id="commentInput-${post.id}"
                type="text"
                placeholder="${currentUser ? "輸入留言內容..." : "未登入僅可查看留言，請先登入後發表"}"
                ${currentUser ? "" : "readonly onclick='guestCommentPrompt()'"}
              />
              <button class="btn btn-primary" onclick="submitComment(${post.id})">送出留言</button>
            </div>
          </div>
        </div>
      `;
    }

    function guestCommentPrompt() {
      if (!currentUser) {
        const goLogin = confirm("是否有平台帳號？將導向登入／註冊頁面。");
        if (goLogin) {
          showSection("homeSection");
          switchAuthTab("login");
          document.getElementById("loginId").scrollIntoView({ behavior: "smooth" });
        }
      }
    }

    function focusComment(postId) {
      if (!currentUser) {
        guestCommentPrompt();
        return;
      }
      const input = document.getElementById(`commentInput-${postId}`);
      if (input) input.focus();
    }

    function renderAllPosts() {
      const container = document.getElementById("allPosts");

      if (posts.length === 0) {
        container.innerHTML = `<div class="empty">目前尚無貼文，成為第一位分享熱血戰績的人吧！</div>`;
        return;
      }

      container.innerHTML = posts.map(post => renderPostCard(post)).join("");
    }

    function renderMyPosts() {
      const container = document.getElementById("myPosts");

      if (!currentUser) {
        container.innerHTML = `<div class="empty">請先登入以查看你的個人首頁與貼文紀錄。</div>`;
        return;
      }

      const myPosts = posts.filter(post => post.userId === currentUser.id);

      if (myPosts.length === 0) {
        container.innerHTML = `<div class="empty">你目前還沒有貼文，立即新增一篇熱血戰績吧！</div>`;
        return;
      }

      container.innerHTML = myPosts.map(post => renderPostCard(post, true)).join("");
    }

    // 初始畫面
    updateUserUI();
    showSection("homeSection");
  </script>
</body>
</html>
